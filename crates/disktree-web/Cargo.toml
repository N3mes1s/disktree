[package]
name = "disktree-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP front end for disktree: the same treemap, marks and removal, in a browser"

[[bin]]
name = "disktree-web"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
disktree-core = { workspace = true }
anyhow = { workspace = true }
rustc-hash = { workspace = true }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust gzip for responses; the frames are repetitive markup that
# compresses an order of magnitude down, which is the wire latency.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tempfile = "3"
miniz_oxide = "0.8"
